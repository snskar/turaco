name: Migrate and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations on Supabase (production)
        run: npx prisma migrate deploy

      - name: Trigger Vercel Deploy Hook (optional)
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"

name: Migrate and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations on Supabase (production)
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Trigger Vercel Deploy Hook (optional)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

